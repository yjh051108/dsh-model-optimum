# dsh-symbiote bundle 层：插入一条插件行（`B192` · 与 model-fit 同族）
#
# 【为什么加它】2026-09-19 · 委托方要「**别人一装上就能用**」，而本包原来【装了不激活】
# ```
# 【现场】本包 `package.json` **没有 `dsh.bundle`** ⇒ `dsh plugin add <dir>` 会**成功**，
#   而 `reconcilePlugins()` **只写一句 warning**：
#     `dsh: warning: … installed as a plain dependency, not a profile layer`
#   ⇒ ★★★ **包进了 `dependencies`，却【不进 `dsh.profile.bundles`】⇒ 不激活** ❌
#   ⇒ 那正是委托方最恨的"装了才发现"。
# 【★ 而本包【本来就是一个完整的 cordis 插件】】`src/index.js` 四件全齐：
#   `export const name = 'dsh-symbiote'`（L27）· `export const inject = ['tools']`（L28）·
#   `export const Config = z.object({})`（L29）· `export function apply(ctx, _config)`（L268）
#   ⇒ ★★ **所以缺的【只有这一份 patch 文件】+ 一个 `dsh` 字段** ✅
# ```
#
# ⚠️ **`name` 必须是【模块名】= `package.json` 的 `name`**（**带 `@dsh-external/` 前缀**）：
# ```
# ★★★ **依据（DSH 本体源码逐字）** —— `cordis-plugin-loader/lib/index.js` 的 `_init()`：
#   `plugin = this.loader.unwrapExports(await this.parent.tree.import(this.options.name, …))`
#   ⇒ ★★ **即：`insert.name` 被【原样拿去 `import()`】** ⇒ **它必须是能 resolve 的模块名** ✅
#   ⇒ 而安装后 profile 的 `node_modules` 里那份是**按 `package.json.name` 落的**
#     ⇒ ★★★ **所以它必须【逐字等于 `package.json.name`】**（否则 `updateError("import")`）❌
# ⚠️ **而 `src/index.js:27` 的 `export const name = 'dsh-symbiote'` 是【插件运行时自报的名字】** ——
#   **它是 `ctx` 里的那个 `name`**，**与"模块名"是两个概念** ⇒ **两者可以不同** ✅
#   ⇒ ★ **所以不能"以源码为准"** —— 这里要的是**模块名**。
#   ⚠️ **我第一版写成 `'dsh-symbiote'`（照源码），是错的** ——
#     判据教训：**判"一个字段该填什么" ⇒ 要读【消费方拿它干什么】，而不是读【生产方自己叫什么】** ✅
# ```
#
# ⚠️ **`config: {}` 是有意的**（与 `teamkit`/`model-fit` 同一口径）：本插件的全部行为由
#   `lib/config.js` 的 schema 驱动，默认值就是"装上就有效果"那一档 ⇒ **不在这里散落路径**（单一事实来源）。
#
# ⚠️ **config 覆盖语义**（`LANDMINES §14.2`，已实测）：profile patch 里覆盖 `config` 是
#   **按顶层键赋值、不是深合并** ⇒ 用户若要覆盖，**必须把要保留的键一起写全**。
- insert:
    - id: dsh-symbiote
      name: '@dsh-external/dsh-symbiote'
      config: {}
